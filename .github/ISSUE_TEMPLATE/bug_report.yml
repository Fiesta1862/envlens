name: Bug report
description: Report incorrect behavior in envlens
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please never include real secret values.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Command you ran and a sanitized version of the env files involved.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: envlens version
      placeholder: "envlens 0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.0.0"
    validations:
      required: true
